# Public site (new_fly_cham) CI/CD.
#
#   pull request → main   build (no deploy)
#   push to main          build, then upload to the Hostinger web hosting
#   "Run workflow" button redeploy main by hand (Actions → Site CI/CD)
#
# cms-flycham.alpatrose.com is served by Hostinger web hosting (LiteSpeed), so
# the site is built here and the static dist/ is uploaded over FTP.
# public/.htaccess (copied into dist/) does the SPA routing + no-cache index.
# The CMS API stays on the VPS (cms-api.cms-flycham.alpatrose.com).
#
# Secrets (Settings → Secrets and variables → Actions), from hPanel →
# Websites → (site) → Files → FTP Accounts:
#   HOSTINGER_FTP_HOST      FTP host/IP (e.g. 76.13.35.251 or ftp.alpatrose.com)
#   HOSTINGER_FTP_USER      FTP username (u123456789 or u123456789.something)
#   HOSTINGER_FTP_PASSWORD  FTP password
#   HOSTINGER_FTP_DIR       the site's folder as the FTP user sees it, e.g.
#                           domains/cms-flycham.alpatrose.com/public_html
#                           (use . when the FTP account opens in that folder)

name: Site CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_URL: https://cms-flycham.alpatrose.com

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund
      - name: Build
        run: |
          cp .env.production.example .env.production
          npm run build
          test -f dist/.htaccess || { echo "::error::dist/.htaccess missing (SPA routing)"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          include-hidden-files: true # keep .htaccess
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # Never run two deploys at once; a newer push waits for the current one.
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp > /dev/null

      # Order keeps the live site whole: new hashed assets first, then
      # index.html + the rest, and only then remove stale assets.
      - name: Upload over FTP
        env:
          FTP_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.HOSTINGER_FTP_DIR || '.' }}
        run: |
          [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$LFTP_PASSWORD" ] \
            || { echo "::error::set the HOSTINGER_FTP_* secrets (see the top of this file)"; exit 1; }
          # Stop at the first failed command (a failed `cd` must never let the
          # --delete mirror run against the wrong folder). TLS when the server
          # offers it; Hostinger's FTP certificate usually does not match the
          # host name, so it is not verified.
          lftp -c "
            set cmd:fail-exit true
            set ftp:ssl-allow true
            set ssl:verify-certificate false
            set net:max-retries 3
            set net:timeout 30
            set mirror:parallel-transfer-count 4
            open --env-password -u '$FTP_USER' '$FTP_HOST'
            cd '$FTP_DIR'
            mkdir -p -f assets
            mirror -R --no-perms --verbose=1 dist/assets assets
            mirror -R --no-perms --delete --verbose=1 -x '^assets/' -x '^\.well-known/' -x '^cgi-bin/' dist .
            mirror -R --no-perms --delete --verbose=1 dist/assets assets
          "

      - name: Check the live site serves this build
        run: |
          want=$(grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1)
          for i in $(seq 1 10); do
            live=$(curl -fsS -m 15 "$SITE_URL/?v=$GITHUB_SHA" | grep -o 'assets/index-[^"]*\.js' | head -1 || true)
            echo "expected $want, live ${live:-none}"
            [ "$live" = "$want" ] && exit 0
            sleep 6
          done
          echo "::error::$SITE_URL is not serving the new build (wrong HOSTINGER_FTP_DIR, or a cache in front)"
          exit 1
